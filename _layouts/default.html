<!DOCTYPE html>
	<html lang="{{ site.lang | default: "en-US" }}">
		<head>
			<meta charset="utf-8">
			{% seo %}
			<link rel="icon" type="image/png" href="/assets/cat_icon.png"/>
			<link rel="preconnect" href="https://fonts.gstatic.com">
			<link rel="preload" href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap" as="style" type="text/css" crossorigin>
			<meta name="viewport" content="width=device-width, initial-scale=1">
			<meta name="theme-color" content="#157878">
			<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
			<link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
			{% include head-custom.html %}
  		</head>
  		<body>
			<a id="skip-to-content" href="#content">Skip to the content.</a>

			<header class="page-header" role="banner">
				<h1>Welcome!</h1>
				<nav>
					<ul>
						<a href="/" class="btn">Home</a>
						<a href="/about/" class="btn">About</a>
						<a href="/thesis/" class="btn">PhD thesis</a>
					</ul>
				</nav>
			</header>

			<main id="content" class="main-content" role="main">
				{{ content }}

				<footer class="site-footer">
					{% if site.github.is_project_page %}
					<span class="site-footer-owner"><a href="{{ site.github.repository_url }}">{{ site.github.repository_name }}</a> is maintained by <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a>.</span>
					{% endif %}
					<span class="site-footer-credits">
						<!-- <li><a href="mailto:lucianostrika44@gmail.com" rel="me"><i class="far fa-envelope"></i></a></li> -->
						<a href="https://github.com/LauPM" rel="me" style="display: inline-block;"><img src="/assets/github-icon.svg" style="width: 18px; height: 18px; vertical-align: middle;"></a>
						<a href="https://bsky.app/profile/laupm.bsky.social" rel="me" style="display: inline-block;"><img src="/assets/bluesky-icon.svg" style="width: 18px; height: 18px; vertical-align: middle;"></a>
						<a href="https://www.linkedin.com/in/laura-p-92ab6630b/" rel="me" style="display: inline-block;"><img src="/assets/linkedin-icon.svg" style="width: 18px; height: 18px; vertical-align: middle;"></a>
					</span>
				</footer>
			</main>
  		</body>
</html>
